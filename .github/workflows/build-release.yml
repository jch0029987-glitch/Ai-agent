name: Build Complete Signed APK (Optimized Native + JNI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Ensure llama.cpp Exists
        run: |
          if [ ! -f "llama.cpp/CMakeLists.txt" ]; then
            git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          fi

      - name: Configure and Build Android ARM64 CPU Llama Binaries
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-android-cpu -S llama.cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_FP16=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LLAMAFILE=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-android-cpu --config Release

      - name: Configure and Build JNI Bridge
        run: |
          if [ ! -d "cpp/llama.cpp" ]; then
            mkdir -p cpp
            cp -r llama.cpp cpp/llama.cpp
          fi

          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-jni -S cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-jni --config Release -- -j2

      - name: Package, Strip, and Move Binaries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          STRIP_TOOL="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          # Grab server & cli
          if [ -f "build-android-cpu/bin/llama-server" ]; then
            cp build-android-cpu/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          elif [ -f "build-android-cpu/llama-server" ]; then
            cp build-android-cpu/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          fi

          if [ -f "build-android-cpu/bin/llama-cli" ]; then
            cp build-android-cpu/bin/llama-cli app/src/main/jniLibs/arm64-v8a/libllama-cli.so
          elif [ -f "build-android-cpu/llama-cli" ]; then
            cp build-android-cpu/llama-cli app/src/main/jniLibs/arm64-v8a/libllama-cli.so
          fi

          # Grab JNI libraries
          find build-jni -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;

          # Strip debug symbols to keep binary footprint tight and efficient
          "$STRIP_TOOL" --strip-unneeded app/src/main/jniLibs/arm64-v8a/*.so
          chmod +x app/src/main/jniLibs/arm64-v8a/*.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PATH: app/release-keystore.jks
        run: |
          echo "$SIGNING_KEY" | tr -d '[:space:]' | base64 --decode > $KEYSTORE_PATH

      - name: Build Release APKs & Bundles
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
