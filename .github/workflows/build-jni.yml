name: Build JNI Bridge Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'cpp/**'

jobs:
  build-jni:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch llama.cpp Source Tree
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git cpp/llama.cpp

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Configure CMake for JNI Bridge
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-jni -S cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build JNI Bridge with Ninja
        run: |
          cmake --build build-jni --config Release

      - name: Upload JNI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-jni-bridge
          path: build-jni/**/*.so
