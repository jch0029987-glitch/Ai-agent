name: Build JNI Bridge Library (Pure CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - 'cpp/**'

permissions:
  contents: write

jobs:
  build-jni:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch llama.cpp Source Tree
        run: |
          if [ ! -d "cpp/llama.cpp" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git cpp/llama.cpp
          fi

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Configure CMake for Pure CPU JNI Bridge
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-jni -S cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build JNI Bridge with Ninja (Throttled & Verbose)
        run: |
          cmake --build build-jni --config Release --verbose -- -j2

      - name: Package JNI Library into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          find build-jni -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          
          chmod +x app/src/main/jniLibs/arm64-v8a/*.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Commit and Push JNI Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update compiled JNI bridge binaries [skip ci]"
            git push
          fi
