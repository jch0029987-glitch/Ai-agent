name: Compile Llama.cpp Shared Libraries for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26c
          android-version: 34

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Configure CMake for Android ARM64 Vulkan (Shared)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DBUILD_SHARED_LIBS=ON

      - name: Build Shared Libraries
        run: cmake --build build-android --config Release -j$(nproc)

      - name: Package .so Files
        run: |
          mkdir -p output/jniLibs/arm64-v8a
          find build-android -name "*.so" -exec cp {} output/jniLibs/arm64-v8a/ \;

      - name: Upload JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-jni-android-vulkan
          path: output/jniLibs/
