name: Compile Llama.cpp Shared Libraries for Android (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install Vulkan SDK, Headers, and glslc
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            vulkan-sdk \
            libvulkan-dev \
            vulkan-headers

      - name: Configure CMake for Android ARM64 Vulkan (Shared)
        run: |
          cmake -B build-android \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc \
            -DCMAKE_CXX_FLAGS="-I/usr/include" \
            -DCMAKE_C_FLAGS="-I/usr/include"

      - name: Build Shared Libraries
        run: cmake --build build-android --config Release

      - name: Package .so Files
        run: |
          mkdir -p output/jniLibs/arm64-v8a
          find build-android -name "*.so" -exec cp {} output/jniLibs/arm64-v8a/ \;

      - name: Upload JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-jni-android-vulkan
          path: output/jniLibs/
