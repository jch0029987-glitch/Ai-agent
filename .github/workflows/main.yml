name: Build Android Llama.cpp with Vulkan (Bulletproof)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure llama.cpp Exists
        run: |
          if [ ! -f "llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp not found or incomplete via submodules. Cloning directly..."
            rm -rf llama.cpp
            git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          fi

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Download and Extract Official LunarG Vulkan SDK
        run: |
          mkdir -p external/vulkan-sdk
          echo "Downloading LunarG Vulkan SDK..."
          wget -q https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz -O vulkan_sdk.tar.xz
          tar -xf vulkan_sdk.tar.xz -C external/vulkan-sdk
          rm vulkan_sdk.tar.xz
          
          SDK_EXTRACTED_DIR=$(ls -d external/vulkan-sdk/*/ | head -n 1)
          echo "Vulkan SDK successfully extracted to: ${{ github.workspace }}/${SDK_EXTRACTED_DIR}x86_64"

      - name: Build and Install SPIRV-Headers Locally
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git external/SPIRV-Headers-src
          cmake -B build-spirv -S external/SPIRV-Headers-src \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/external/spirv-install"
          cmake --build build-spirv --target install

      - name: Configure CMake for Android Vulkan
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          SDK_DIR=$(ls -d external/vulkan-sdk/* | head -n 1)
          VULKAN_SDK_BIN="${{ github.workspace }}/$SDK_DIR/x86_64"
          
          cmake -B build-android -S llama.cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DSPIRV-Headers_DIR="${{ github.workspace }}/external/spirv-install/share/cmake/SPIRV-Headers" \
            -DVulkan_GLSLC_EXECUTABLE="$VULKAN_SDK_BIN/bin/glslc" \
            -DVulkan_INCLUDE_DIR="$VULKAN_SDK_BIN/include" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          cmake --build build-android --config Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-vulkan-libs
          path: |
            build-android/**/*.so
            build-android/**/libllama*
