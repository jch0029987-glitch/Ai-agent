name: Build Android Llama.cpp CPU (Pixel 9 Optimized)

on:
  workflow_dispatch:

jobs:
  build-android-cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure llama.cpp Exists
        run: |
          if [ ! -f "llama.cpp/CMakeLists.txt" ]; then
            git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          fi

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Configure CMake for Android ARM64 CPU (Tensor G4 + Standalone Server & CLI)
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-android-cpu -S llama.cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_FP16=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LLAMAFILE=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          cmake --build build-android-cpu --config Release

      - name: Package Standalone Binaries as Native .so Assets
        run: |
          mkdir -p output_so
          
          # Grab the standalone server executable
          if [ -f "build-android-cpu/bin/llama-server" ]; then
            cp build-android-cpu/bin/llama-server output_so/libllama-server.so
          elif [ -f "build-android-cpu/llama-server" ]; then
            cp build-android-cpu/llama-server output_so/libllama-server.so
          fi

          # Grab the standalone cli executable
          if [ -f "build-android-cpu/bin/llama-cli" ]; then
            cp build-android-cpu/bin/llama-cli output_so/libllama-cli.so
          elif [ -f "build-android-cpu/llama-cli" ]; then
            cp build-android-cpu/llama-cli output_so/libllama-cli.so
          fi

      - name: Upload Optimized Server & CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libllama-binaries-optimized
          path: output_so/
