name: Build Android Llama.cpp CPU (Pixel 9 Optimized)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure llama.cpp Exists
        run: |
          if [ ! -f "llama.cpp/CMakeLists.txt" ]; then
            git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          fi

      - name: Set up Ninja Build Tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Configure CMake for Android ARM64 CPU (Tensor G4 + Standalone Server & CLI)
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-android-cpu -S llama.cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_FP16=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LLAMAFILE=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          cmake --build build-android-cpu --config Release

      - name: Package Standalone Binaries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          if [ -f "build-android-cpu/bin/llama-server" ]; then
            cp build-android-cpu/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          elif [ -f "build-android-cpu/llama-server" ]; then
            cp build-android-cpu/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          fi

          if [ -f "build-android-cpu/bin/llama-cli" ]; then
            cp build-android-cpu/bin/llama-cli app/src/main/jniLibs/arm64-v8a/libllama-cli.so
          elif [ -f "build-android-cpu/llama-cli" ]; then
            cp build-android-cpu/llama-cli app/src/main/jniLibs/arm64-v8a/libllama-cli.so
          fi
          
          chmod +x app/src/main/jniLibs/arm64-v8a/libllama-*.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Commit and Push Native Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/jniLibs/arm64-v8a/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update pre-compiled llama binaries [skip ci]"
            git push
          fi
