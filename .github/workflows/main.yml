name: Build Android Llama.cpp with Vulkan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add and Update llama.cpp Submodule
        run: |
          git submodule add https://github.com/ggml-org/llama.cpp.git llama.cpp || true
          git submodule update --init --recursive

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Download SPIRV-Headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git external/SPIRV-Headers

      - name: Configure CMake for Android Vulkan
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | head -n 1)
          
          cmake -B build-android -S llama.cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_VULKAN=ON \
            -DSPIRV-Headers_DIR="${{ github.workspace }}/external/SPIRV-Headers/cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          cmake --build build-android --config Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-vulkan-libs
          path: |
            build-android/**/*.so
            build-android/**/libllama*
